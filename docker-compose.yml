services:
  # Frontend Application (React/Vite Dev Server)
  frontend:
    build: .
    container_name: agus_finance_frontend
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Change this to 'dev' if you have dev keys, or 'prod' for production keys
      - VITE_ENVIRONMENT=prod
    # Using the command from Dockerfile, but ensuring we bind to 0.0.0.0
    command: npm run dev -- --host 0.0.0.0 --port 3000
    restart: always

volumes:
  node_modules:
